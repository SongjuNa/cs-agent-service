[project]
name = "cs-agent-service"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "psycopg[binary]",
    "pyyaml",
    "google-genai",
    "langgraph",
]

[project.optional-dependencies]
test = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 저장소 루트의 jobs/와, 시험끼리 서로 불러오는 tests.acceptance를 찾기 위해
pythonpath = [".", ".."]
