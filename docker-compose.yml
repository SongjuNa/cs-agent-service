services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # 데이터가 비어 있을 때 한 번만 실행된다 (테이블 정의서 v1.3)
      - ./docs/database/schema.sql:/docker-entrypoint-initdb.d/10_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_MODEL_SMALL: ${LLM_MODEL_SMALL:-gemini-3.8-flash}
      LLM_MODEL_TRANSCRIBE: ${LLM_MODEL_TRANSCRIBE:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-2}
    ports:
      - "8000:8000"
    volumes:
      # 지시문과 반품 단어장은 저장소 맨 위에 있어 이미지에 없다. 서버가 찾는 자리(/prompts, /config)에 붙인다
      - ./prompts:/prompts:ro
      - ./config:/config:ro
      # 고장 사전 증상 벡터 캐시(FR-018). 컨테이너를 다시 만들어도 남긴다
      - fault-cache:/app/.cache
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  fault-cache:
